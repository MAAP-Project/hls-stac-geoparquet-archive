name: CI

on:
  workflow_dispatch:
    inputs:
      release:
        description: Release tag or commit SHA to deploy
        required: true
        type: string
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.release || github.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.*"
          enable-cache: false

      - name: Run pre-commit
        run: uv run pre-commit run --all-files

      - name: Run tests
        run: uv run pytest

  docs:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.*"
          enable-cache: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Activate pnpm
        run: corepack enable && corepack prepare pnpm@9.15.0 --activate

      - name: Install dependencies
        run: |
          uv sync --locked
          pnpm install --frozen-lockfile

      - name: Build documentation
        run: pnpm build
        env:
          SITE_PREFIX: /hls-stac-geoparquet-archive

      - name: Verify documentation navigation and slide rendering
        run: uv run python scripts/check-slide-site.py --prefix /hls-stac-geoparquet-archive --browser google-chrome

  deploy:
    runs-on: ubuntu-latest
    needs: tests
    if: github.event_name == 'workflow_dispatch'
    environment: dev
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.release }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-west-2

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache-dependency-path: infrastructure/package-lock.json
          package-manager-cache: false

      - name: Install CDK dependencies
        working-directory: infrastructure
        run: npm ci

      - name: Deploy
        working-directory: infrastructure
        env:
          EARTHDATA_USERNAME: ${{ vars.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
        run: npx cdk deploy --all
